plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

base { archivesName = 'AetherGlass' }
version = project.mod_version
group = project.maven_group

loom {
    mods {
        "aetherglass" {
            sourceSet sourceSets.main
        }
    }

    runConfigs.configureEach {
        vmArgs '-Xmx2G'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Тесты проверяют только чистую логику (цвет, анимации, пул частиц) — без запуска игры.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Сборочная машина ограничена по памяти: тестам хватает 256 МБ,
    // а остальное остаётся Gradle и задаче переименования классов.
    maxHeapSize = '256m'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'minecraft_version': project.minecraft_version,
               'loader_version': project.loader_version
    }
}

java {
    withSourcesJar()
}

tasks.named('jar', Jar) {
    // Промежуточный (непереведённый) jar: чтобы в каталоге сборки не было двух «похожих» файлов.
    archiveFileName = 'AetherGlass-dev.jar'
    // Файл LICENSE лежит в корне проекта, поэтому путь берётся оттуда.
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_aetherglass' } }
}


// Готовый мод называется ровно AetherGlass.jar (версия живёт внутри fabric.mod.json).
// remapJar — последняя задача в цепочке, поэтому имя задаётся именно ей.
tasks.named('remapJar') {
    archiveFileName = 'AetherGlass.jar'
}
