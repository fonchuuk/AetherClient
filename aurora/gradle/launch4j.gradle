// Нативная сборка самодостаточных 64-битных Windows .exe (x86_64-w64-mingw32-gcc + windres)
// без зависимости от Launch4j и без ошибки «JDK 21 not found».
//
// Как устроен получаемый .exe:
// 1. Нативный 64-битный GUI-загрузчик (tools/native_bootstrap.c) с иконкой (.ico),
//    манифестом Windows и таблицей VERSIONINFO.
// 2. В конец .exe напрямую приклеивается собранный .jar-архив (ZIP читается с конца файла).
// 3. При запуске на Windows загрузчик сам находит любую установленную Java 17..25+
//    (в системе, PATH, Program Files, .jdks, Minecraft Launcher, TLauncher, Prism,
//    Modrinth, CurseForge, LunarClient и реестре), а если на чистом ПК вообще нет Java —
//    автоматически скачивает портативную OpenJDK 21 в %LOCALAPPDATA%\AetherGlass\runtime.

def buildWorkDir = layout.buildDirectory.dir('launch4j')
def rcFile = layout.buildDirectory.file('launch4j/app.rc')

tasks.register('prepareLaunch4j') {
    group = 'distribution'
    description = 'Подготавливает рабочий каталог для сборки нативного Windows .exe.'
    doLast {
        buildWorkDir.get().asFile.mkdirs()
    }
}

tasks.register('writeLaunch4jConfig') {
    group = 'distribution'
    description = 'Генерирует файл ресурсов Windows (.rc) с иконкой, манифестом и версией.'
    dependsOn tasks.named('jar'), 'prepareLaunch4j'
    outputs.file(rcFile)
    def iconFile = project.launch4jIcon
    def productVersion = project.mod_version
    doLast {
        def verParts = (productVersion + '.0.0.0').split('\\.')[0..3].collect {
            it.replaceAll('[^0-9]', '') ?: '0'
        }.join(', ')
        def manifestLine = project.hasProperty('launch4jManifest')
                ? "1 24 \"${project.launch4jManifest.absolutePath.replace('\\', '/')}\""
                : ""
        def iconPath = iconFile.absolutePath.replace('\\', '/')
        def internalName = project.launch4jExeName.replace('.exe', '')
        def rcText = """#include <winver.h>
1 ICON "${iconPath}"
${manifestLine}
1 VERSIONINFO
FILEVERSION ${verParts}
PRODUCTVERSION ${verParts}
FILEFLAGSMASK 0x3fL
FILEFLAGS 0x0L
FILEOS 0x40004L
FILETYPE 0x1L
FILESUBTYPE 0x0L
BEGIN
  BLOCK "StringFileInfo"
  BEGIN
    BLOCK "040904E4"
    BEGIN
      VALUE "CompanyName", "AetherGlass\\0"
      VALUE "FileDescription", "${project.launch4jDescription}\\0"
      VALUE "FileVersion", "${productVersion}\\0"
      VALUE "InternalName", "${internalName}\\0"
      VALUE "LegalCopyright", "AetherGlass Client\\0"
      VALUE "OriginalFilename", "${project.launch4jExeName}\\0"
      VALUE "ProductName", "${project.launch4jProductName}\\0"
      VALUE "ProductVersion", "${productVersion}\\0"
    END
  END
  BLOCK "VarFileInfo"
  BEGIN
    VALUE "Translation", 0x0409, 1252
  END
END
"""
        def f = rcFile.get().asFile
        f.parentFile.mkdirs()
        f.setText(rcText, 'UTF-8')
    }
}

tasks.register('exe') {
    group = 'distribution'
    description = 'Собирает автономный 64-битный Windows .exe (нативный загрузчик + встроенный .jar).'
    dependsOn 'prepareLaunch4j', 'writeLaunch4jConfig', tasks.named('jar')
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    def exeFile = layout.buildDirectory.file('exe/' + project.launch4jExeName)
    def bootstrapSrc = rootProject.file('tools/native_bootstrap.c')
    inputs.files(jarFile, project.launch4jIcon, rcFile, bootstrapSrc)
    if (project.hasProperty('launch4jManifest')) {
        inputs.file(project.launch4jManifest)
    }
    outputs.file(exeFile)

    doLast {
        def workDir = buildWorkDir.get().asFile
        workDir.mkdirs()
        def resObj = new File(workDir, 'app_res.o')
        def stubExe = new File(workDir, 'stub.exe')
        def targetExe = exeFile.get().asFile
        targetExe.parentFile.mkdirs()

        // 1. Компилируем ресурсы Windows (.ico + .manifest + VERSIONINFO)
        def windresProc = new ProcessBuilder(
                'x86_64-w64-mingw32-windres',
                '-i', rcFile.get().asFile.absolutePath,
                '-o', resObj.absolutePath
        ).redirectErrorStream(true).start()
        def windresOut = windresProc.inputStream.getText('UTF-8')
        if (windresProc.waitFor() != 0) {
            throw new GradleException("Ошибка windres:\n" + windresOut)
        }

        // 2. Компилируем нативный 64-битный Win32 GUI-загрузчик
        def heapMax = project.hasProperty('launch4jHeapMax') ? String.valueOf(project.launch4jHeapMax) : '512'
        def prodTitle = String.valueOf(project.launch4jProductName)
        def gccProc = new ProcessBuilder(
                'x86_64-w64-mingw32-gcc',
                '-O2', '-s', '-municode', '-mwindows',
                "-DHEAP_MAX_MB=${heapMax}",
                "-DPRODUCT_TITLE_W=L\"${prodTitle}\"",
                bootstrapSrc.absolutePath,
                resObj.absolutePath,
                '-ladvapi32', '-lshell32', '-luser32', '-lgdi32',
                '-o', stubExe.absolutePath
        ).redirectErrorStream(true).start()
        def gccOut = gccProc.inputStream.getText('UTF-8')
        if (gccProc.waitFor() != 0) {
            throw new GradleException("Ошибка x86_64-w64-mingw32-gcc:\n" + gccOut)
        }

        // 3. Склеиваем нативный PE-загрузчик и .jar в единый самодостаточный .exe
        def jar = jarFile.get().asFile
        targetExe.withOutputStream { out ->
            stubExe.withInputStream { out << it }
            jar.withInputStream { out << it }
        }

        // Дополнительно кладём копию .jar рядом, если включён launch4jExternalJar
        if (project.hasProperty('launch4jExternalJar')
                && String.valueOf(project.launch4jExternalJar) == 'true') {
            def near = layout.buildDirectory.file('exe/' + jar.name).get().asFile
            java.nio.file.Files.copy(jar.toPath(), near.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        println "Собран автономный .exe: ${targetExe.name} (${targetExe.length()} байт)"
    }
}
